[project]
name = "agnostic-boardroom"
version = "0.1.0"
description = "Standalone, agent-agnostic MCP backend rebuild of Wingman's Boardroom/pipeline (experimental, in-progress)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "agno>=2.8",
    "lancedb>=0.34",
    "fastembed>=0.5",
    "tiktoken>=0.13",
    "mcp>=1.28",
    # Required transitively by `agno.workflow` (its package __init__ imports
    # `agno.workflow.remote.RemoteWorkflow`, which imports `fastapi` unconditionally,
    # even though this repo never runs the remote/HTTP workflow surface) -- confirmed
    # via a real `ModuleNotFoundError` when first importing `agno.workflow` for the
    # loop/graph Agno-native rewrite, not assumed.
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# live_model tests cost real money (headless `claude -p` calls) -- excluded
# from the default run, run explicitly via `pytest -m live_model` when
# Phase 3/4's real behavioral claim needs re-proving.
addopts = "-m 'not live_model'"
markers = [
    "live_model: costs real money via headless `claude -p`; run explicitly, not on every test invocation",
]
