## Harness note: Gemini CLI (auto-generated by `generate-harness-adapters.mjs` -- do not hand-edit)

This file is a generated copy of the canonical Claude Code source. It references the following Claude-Code-specific mechanism(s); here is the real Gemini CLI equivalent:

- **AskUserQuestion**: Gemini CLI has a real, confirmed structured question tool: `ask_user` (1-4 choices, blocking). Use it directly in place of `AskUserQuestion` -- this is the closest match to Claude Code's own tool found in any evaluated harness, not a prose fallback.
- **ExitPlanMode**: Gemini CLI has a real Plan mode, but exiting it auto-escalates to YOLO mode, which bypasses further tool-approval gating entirely -- there is no discrete, interceptable "plan approved" event to hook the way `ExitPlanMode` + `boardroom-checkpoint.mjs` do. The disclosed substitute is a `BeforeAgent`/`Notification` hook watching for the mode-switch signal (see `gemini-cli/hooks/plan-gate.mjs`) plus `dod-pre-push-check.mjs`'s existing git-push fallback as a second, independent backstop -- treat this as a weaker gate than Claude Code's, not an equivalent one.

'''
