description = "Clarify a founder's raw idea into a clear problem statement, target user, and success signal before any requirements or design work starts."
prompt = '''

# Wingman: Discovery

The first of Wingman's 14 pipeline stages, and the first stage of **Phase 1: Problem Definition & Market Validation** (with `research-synthesis.md` and `personas-jobs.md`) — that phase's goal is making sure a founder is building something people actually want before spending any time managing an AI coding agent. Before anything gets scoped into requirements, make sure the underlying problem is actually understood — a well-built solution to the wrong problem is still a wasted build. Include a feasibility check as part of this: search for existing competitors or prior attempts; if nobody else is solving this, ask plainly whether that's because it isn't a real problem, or because it's genuinely hard.

{{args}}

## Discovery.0: Triage

Use the `change-triage` skill to classify this request before anything else. A Level 0-1 request
(a small, reversible, non-trust-boundary fix) routes to `/wingman:hotfix`'s lightweight loop instead
of continuing through Discovery — tell the founder plainly and stop here. A Level 4 request (active
production incident) routes to `/wingman:incident` immediately. Level 2-3 requests continue to
Discovery.1 normally; a Level 3 classification means every downstream checkpoint for this request is
mandatory full review, never skippable later.

## Discovery.1: Understand the ask

If the request is vague or could mean several different things, ask a small number of plain-language clarifying questions — focus on business outcomes ("who uses this and what do they do with it", "what happens today without this", "what would make this a failure") rather than technical specifics.

Do not ask the founder to make technical decisions (frameworks, data models, file layout) — that's `architecture.md`'s job, several stages from now. Only escalate a question here if it's a business/product tradeoff or a one-way door.

If the project's shape clearly matches one of `references/org-template/project-types/catalog.md`'s 7 types, consult that type's short playbook for what typically changes in later stages — never force a fit; most projects are close to one type but not exact, and this conversation always takes precedence over a category label.

**If the founder attaches an image or screenshot** (a competitor's UI, a sketch, an existing product
they want to match or replace), read it directly (the `Read` tool handles images natively — no new
dependency) and fold what it actually shows into the fields below, same as any other evidence: name
what the image shows in the Problem statement/Target user fields, and mint a `DISC-*` row for any
concrete finding drawn from it (e.g. "the competitor's onboarding flow requires 6 steps before value
is shown"). Never describe an image from a general impression — cite specifically what's visible
(a labeled button, a stated price, a visible error state), the same evidence standard as any other
Discovery finding. Figma files and voice input are **not yet supported** — both need a real external
service integration (a design-tool API token, speech-to-text) this plugin doesn't ship with zero
dependencies; see `docs/HUMAN-TODOS.md` for the adapter contract each would need and why it's
credential-gated rather than faked.

## Discovery.2: Confirm the Product department is active

Use the `department-lead-activation` skill to ensure `dept-product` exists for this project (its activation signal is always true) — create it in the founder's `.claude/agents/` if it doesn't exist yet, then delegate the requirements-analysis portion of this step to it.

Immediately after, use the `management-board-activation` skill to check the Management Board activation threshold (see `references/pipeline-stage-boilerplate.md`'s Activation Checks section for the shared criteria) — if crossed, `mgr-product` (and `mgr-research`, which activates alongside Product) may need creating.

## Discovery.3: Write the Discovery output

Produce a short artifact. Append this section to a scratch discovery doc (`docs/wingman/discovery/<short-slug>.md` in the founder's project, creating the directory if needed):

```markdown
## Discovery output

**Problem statement:** <the concrete problem, with any evidence available — not a vibe>
**Target user:** <who actually uses this and in what situation>
**Success signal:** <how we'll know this actually solved the problem, in observable terms>
**Open questions:** <anything genuinely unresolved that the founder should weigh in on later, if anything>
**Jobs-to-be-done notes:** <the trigger that makes the target user look for a solution, and what "better" looks like to them>
**Trigger/why-now:** <what makes this worth doing now, not later — ideally evidence-backed, not just a vibe>
**Constraints:** <team size/solo-founder reality, existing stack that's already a given, anything not up for debate>
**Scope boundary:** <what this pass explicitly does NOT cover, so a later stage doesn't quietly scope-creep>
**Solo-founder realism check:** <is this actually buildable by one founder in a reasonable timeframe, or does it need to be cut down first>

### Discovery findings

| ID | Finding | Evidence | Satisfies |
|---|---|---|---|
| DISC-001 | <one concrete, separable finding drawn from the fields above — a problem, a constraint, or a success signal worth tracing> | <known / unknown / assumed> | — |
```

**Why the ID table as well as the prose:** Discovery is the **root of the traceability chain** — every
later stage's `Satisfies` column ultimately points back here (`research-synthesis.md` writes
`| RS-001 | … | DISC-001 |`, and `skills/traceability-linking` reserves the `DISC-` prefix for this
stage). Mint the IDs here via the `traceability-linking` skill. Discovery's `Satisfies` column is
always `—`: nothing precedes the vision, which is exactly what makes this the root. Without these
rows, any downstream artifact carrying a `wingman:req DISC-001` marker is an **orphan** and
`check-traceability.mjs` fails the project with a hard error — the prose fields alone are not
traceable, because the checker mints IDs only from a Markdown table row's first cell.

Keep the prose fields *and* the table: the prose is what the founder reads at the checkpoint, the
table is what every later stage links to. One finding may draw on several prose fields, and not
every prose field needs its own row — mint a row for what later stages will genuinely need to point at.

**Why all 8 fields, not 4:** this stage's own Gate checklist below lists these same 8 items as
Must-include — a real maintainer-mode dogfood run (see `docs/history/retros.md`, 2026-07-25/26)
found that an earlier 4-field version of this template caused 3 of 8 real Boardroom seats (CEO,
CPO, CTO, Research) to independently flag "missing sections" on output that matched the template
exactly, because the template and the Gate checklist a few lines below it had drifted out of sync.
Keep both in sync if either changes.

## Discovery.4: Where you are

See `references/pipeline-stage-boilerplate.md`'s Where You Are section. Use `skills/visual-founder-output` to add the pipeline-status tree after the Discovery output above — detect the session's rendering tier first, never assume.

## Discovery.5: Gate checklist

Before the checkpoint below, run the adaptive gap-finding loop and the 8-part output format from
`references/pipeline-gate-checklist.md`, then confirm this stage's own gate:

- **Must include:** problem statement, user statement, jobs-to-be-done notes, trigger/why-now,
  constraints, success criteria, scope boundary, solo-founder realism check, **and at least one
  `DISC-*` row in the Discovery findings table** (the chain root — see Discovery.3).
- **Must decide:** what problem is being solved, who the primary user is, and whether the idea is
  too large for one solo founder to build.
- **Gate passes only if** the problem, the user, and the scope are all clear, **and every finding a
  later stage will need to reference has a `DISC-*` ID**. If the idea is too large, say so directly
  in the Discovery output and propose a smaller cut before the gate can pass.

## Discovery.6: Discovery checkpoint

Run `/wingman:boardroom` with scope set to this stage's own Discovery output above — not a bundle,
not a preview of later stages. The checkpoint checks the gate checklist above, not just the output
in general: it confirms every Must-include item is present and every Must-decide question is
answered. The founder approves or sends back changes through this one plain-language checkpoint
before the pipeline moves on.

If the gate does not pass, the checkpoint blocks here and names the specific missing item(s) to the
founder — never a generic "needs work." Only once the checkpoint returns a "ship it" decision should
you hand off to `/wingman:research-synthesis`.

## References

- `references/org-template/README.md` — the project-type catalog consulted in Step 1, and the two
  other founder-context guides (`founder-preferences.md`, `capability-map.md`) `skills/memory`
  draws on.
- `references/pipeline-gate-checklist.md` — the shared adaptive gap-finding loop, self-critique
  questions, gap register, and 8-part output format every stage runs before its own checkpoint.
- `skills/traceability-linking` — the `DISC-*` prefix minted in Discovery.3, and the chain every
  later stage's `Satisfies` column follows back to it.
- `skills/visual-founder-output` + `references/visual-output-templates.md` §2 — the pipeline-status
  tree shown above.
- `commands/adaptive/boardroom.md` — the checkpoint this stage now records on its own, per
  `docs/status/ARCHITECTURE.md` §4d.

'''
