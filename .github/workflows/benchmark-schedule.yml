name: Benchmark regression check

# Continuous benchmarking (PR9 of the AI Engineering Operating System build): a scheduled check
# that the agent-weakness coverage benchmark (docs/status/AGENT-WEAKNESS-BENCHMARK.md, scored by
# scripts/wingman-metrics.mjs §5) doesn't silently regress over time. Deliberately NOT a
# service-style MLOps benchmark (p95 latency, throughput, cache-hit-rate) -- that shape was
# assessed and declined twice already (docs/status/PROJECT.md's decisions log), since Wingman has
# no persistent runtime or request traffic to instrument against (docs/status/ARCHITECTURE.md §2).
# This is automation over a metric that already exists and is already computed from real files.
#
# Weekly + on-demand only, matching evals.yml's own two-tier split -- never per-PR, since this
# check doesn't need to gate every change, only catch silent drift over time.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, an hour after evals.yml's own weekly run

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: node scripts/check-benchmark-regression.mjs
