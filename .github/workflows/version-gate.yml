name: Version gate

# Fail a PR that changes shipped plugin content without bumping
# plugins/wingman/.claude-plugin/plugin.json's "version". Without a bump,
# `claude plugin update` silently no-ops on a directory-sourced plugin, so a
# founder never receives the change — a real bug hit in PR #4. Pattern from
# vendor/awesome-claude-code-subagents/.github/workflows/enforce-plugin-version-bump.yml,
# simplified: Wingman is one plugin and its marketplace.json carries no version
# field, so there's nothing to cross-sync — plugin.json is the single source.
#
# Runs on every PR (no `paths:` filter) so this job's context always appears —
# required for it to work as a GitHub branch-protection required check without
# deadlocking a docs/test-only PR that would otherwise never get a context at
# all. The "skip if no plugin content changed" guard below is what makes that
# safe: a PR touching only docs/tests/root scripts exits 0 immediately.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a plugin.json version bump when shipped content changed
        id: version_check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          PLUGIN_JSON="plugins/wingman/.claude-plugin/plugin.json"

          base="${BASE_SHA:-}"
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "Comparing HEAD against base ${base}"

          # Skip entirely if this PR touches none of the shipped-plugin paths --
          # this is what makes running on every PR (no `paths:` filter above)
          # safe: a docs/test-only PR gets a passing context instead of no
          # context at all, which is what a required check needs to avoid
          # deadlocking non-plugin PRs.
          if ! git diff --name-only "${base}...HEAD" -- \
                plugins/wingman/commands \
                plugins/wingman/agents \
                plugins/wingman/skills \
                plugins/wingman/hooks \
                plugins/wingman/references \
                plugins/wingman/scripts \
                "${PLUGIN_JSON}" \
                | grep -q .; then
            echo "No shipped plugin content changed — nothing to check. OK."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          extract_version() {
            sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1
          }

          if ! git cat-file -e "${base}:${PLUGIN_JSON}" 2>/dev/null; then
            echo "No plugin.json at base — new plugin, nothing to compare. OK."
            exit 0
          fi

          old_version="$(git show "${base}:${PLUGIN_JSON}" | extract_version)"
          new_version="$(extract_version < "${PLUGIN_JSON}")"
          echo "plugin.json version: base=${old_version} head=${new_version}"

          if [ "${old_version}" = "${new_version}" ]; then
            echo "::error file=${PLUGIN_JSON}::Shipped plugin content changed but \"version\" was not bumped (still ${new_version}). Bump it so 'claude plugin update' actually applies the change."
            exit 1
          fi
          echo "✓ version bumped ${old_version} → ${new_version}"

      - name: Require a matching CHANGELOG.md entry
        if: success() && steps.version_check.outputs.changed == 'true'
        shell: bash
        run: node scripts/check-changelog-entry.mjs "$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' plugins/wingman/.claude-plugin/plugin.json | head -n1)"
