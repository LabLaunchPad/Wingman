name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: node plugins/wingman/scripts/validate-structure.mjs
      - run: node scripts/check-repo-consistency.mjs
      - run: node scripts/check-fixtures.mjs
      - run: node plugins/wingman/scripts/check-traceability.mjs
      - run: node plugins/wingman/scripts/validate-wkos.mjs
      - run: node plugins/wingman/scripts/validate-engines.mjs
      - run: node plugins/wingman/scripts/check-harness-adapter-drift.mjs
      - run: node plugins/wingman/scripts/generate-harness-adapters.mjs --check
      # Scoped to tests/ deliberately: a bare `node --test` also recurses into vendor/'s own
      # test files, which are pinned upstream reference repos and not this repo's concern.
      # The glob is left unquoted so the shell expands it to explicit paths -- Node 20 (pinned
      # above) and Node 22 disagree on how they handle glob/directory arguments themselves.
      - run: node --test tests/*/*.test.mjs
