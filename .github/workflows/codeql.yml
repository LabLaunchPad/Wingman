name: CodeQL

# Static analysis for the executable JavaScript in this repo -- the hook and
# validator scripts under plugins/wingman/hooks/, plugins/wingman/scripts/,
# and scripts/, plus evals/run-headless.mjs. This is the one real security
# surface Wingman has (see SECURITY.md's scope): these scripts parse
# `git status` output and tool-call JSON, so command-injection/path-traversal
# classes are worth a mechanical check, unlike the markdown command/skill/
# agent content, which is out of SECURITY.md's scope by design.
#
# No `paths:` filter below -- CodeQL's language autobuild needs the whole
# checkout to resolve module graphs correctly, so this scans the full repo
# rather than just the paths named above. That's over-scanning, not a gap:
# everything outside those paths is markdown/JSON with no JS to analyze.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 3" # Wednesdays 07:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:javascript-typescript"
